name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      # >>> release-input:begin
      # 由 scripts/sync-release-input.mjs 在每次正式发布后自动维护，请勿手改
      version:
        description: "Version to release, without the leading v. Last released: 0.0.7"
        default: "0.0.8"
        required: true
        type: string
      # <<< release-input:end

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 解析版本号；手动触发时把版本写进 apps/desktop/package.json，提交并打 tag。
  # 用 GITHUB_TOKEN 推送的 commit/tag 不会再次触发 workflow，所以这里不会递归执行。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="$GITHUB_REF_NAME"
          fi

          VERSION="${RAW#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid version '$RAW', expected x.y.z or x.y.z-suffix"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reset existing release to draft
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail

          # 重发一个已经发布过的版本时先转回草稿：
          # electron-builder 对「已发布的同名 release」会以
          # "existing type not compatible with publishing type" 静默跳过上传。
          state=$(gh api "repos/$REPO/releases/tags/$TAG" \
            --jq 'if .draft then "draft" else "published" end' 2>/dev/null || echo "missing")

          if [ "$state" = "published" ]; then
            echo "::notice::Release $TAG 已发布，重发前先转回草稿"
            gh release edit "$TAG" --draft
          else
            echo "Release $TAG 当前状态：$state，无需处理"
          fi

      - name: Bump desktop version, commit and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          PACKAGE_JSON="apps/desktop/package.json"

          # 允许同版本重发，但不允许把默认分支上的版本号改小
          node -e "
          const pkg = require('./apps/desktop/package.json');
          const parse = (v) => v.split('-')[0].split('.').map(Number);
          const current = parse(pkg.version);
          const next = parse(process.env.VERSION);
          for (let i = 0; i < 3; i++) {
            if (next[i] < current[i]) {
              console.log('::error::' + process.env.VERSION + ' is lower than the current version ' + pkg.version);
              process.exit(1);
            }
            if (next[i] > current[i]) break;
          }
          "

          node -e "
          const fs = require('fs');
          const file = 'apps/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          "

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PACKAGE_JSON"
          if git diff --cached --quiet; then
            echo "$PACKAGE_JSON already at $VERSION, skipping version commit"
          else
            git commit -m "release: $TAG"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

          # 同版本重发：tag 已存在时直接指向当前提交。
          # changelogithub 会 PATCH 已存在的同 tag release，electron-builder 也会覆盖同名 asset。
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists on origin, moving it to the current commit"
            git tag -f "$TAG"
            git push --force origin "refs/tags/$TAG:refs/tags/$TAG"
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG:refs/tags/$TAG"
          fi

  create-release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog and create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: npx changelogithub@14 --draft --to "$TAG" --name "$TAG"

  build:
    needs: [prepare, create-release]
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm --filter zhiyuan build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          path: apps/desktop/out/

  publish:
    needs: [prepare, build]
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            build_flag: --mac
          - os: ubuntu-latest
            build_flag: --linux
          - os: windows-latest
            build_flag: --win

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: desktop-build
          path: apps/desktop/out/

      - name: Package and publish
        run: |
          cd apps/desktop
          npx electron-builder ${{ matrix.build_flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 三平台资产全部上传完成后，把草稿转正；转正成功后再同步发版入口的提示版本。
  # 任一平台失败时本 job 不会执行，release 保持草稿 —— 对外不可见，可重跑同一版本。
  finalize:
    needs: [prepare, publish]
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # 先转正（draft=false），这一步成功就意味着 release 对外可见了
          gh release edit "$TAG" --draft=false

          # 预发布版本不参与 latest 标记；设置失败也不影响发布结果
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            echo "预发布版本，跳过 latest 标记"
          elif ! gh release edit "$TAG" --latest; then
            echo "::warning::设置 latest 失败，GitHub 通常会自动把最新的正式版标为 latest"
          fi

          echo "release $TAG 已发布为正式版"

      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync release input hint
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          node scripts/sync-release-input.mjs "$VERSION"

          if [ -z "$(git status --porcelain .github/workflows/release.yml)" ]; then
            echo "发版入口提示已是最新，跳过提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          git commit -m "chore(release): 同步发版入口提示（$TAG）"

          # 此时 release 已经发布成功，提示提交只是锦上添花，失败不阻塞流水线
          if ! git push origin "HEAD:$DEFAULT_BRANCH"; then
            echo "::warning::发版入口提示推送失败（$DEFAULT_BRANCH 可能已前进），下次发版会自动覆盖"
          fi
