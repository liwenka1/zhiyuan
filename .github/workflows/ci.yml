name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 与发版流程完全一致的构建门禁，用来保证「CI 绿 = 发版不会卡在构建」
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Core security tests
        run: pnpm test:core

      - name: Build desktop app
        run: pnpm --filter zhiyuan build

  # 三平台真机打包冒烟：只出包、不发布，确保 electron-builder 各平台配置都没问题
  package:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_flag: --mac
          - os: ubuntu-latest
            build_flag: --linux
          - os: windows-latest
            build_flag: --win

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm --filter zhiyuan build

      - name: Package without publishing
        run: |
          cd apps/desktop
          npx electron-builder ${{ matrix.build_flag }} --publish never
